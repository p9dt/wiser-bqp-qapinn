run_name: heat_siren_local
seed: 1234

pde:
  name: heat
  alpha: 0.05
  modes: [[1, 1.0], [4, 0.5]]
  t_max: 1.0

model:
  type: mlp
  hidden: 20
  depth: 4
  activation: sin
  siren_omega0: 30.0

training:
  n_collocation: 8000
  n_supervised: 400
  adam_epochs: 6000
  adam_lr: 0.001
  lbfgs_epochs: 500
  resample_every: 0
  w_pde: 1.0
  w_data: 1.0
  log_every: 1000
  eval_every: 2000
