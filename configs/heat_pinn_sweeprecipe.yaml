run_name: heat_pinn_sweeprecipe
seed: 1234

pde:
  name: heat
  alpha: 0.05
  modes: [[1, 1.0], [4, 0.5]]
  t_max: 1.0

model:
  type: mlp
  hidden: 20
  depth: 4
  activation: tanh

training:
  n_collocation: 2000
  n_supervised: 300
  adam_epochs: 3000
  adam_lr: 0.005
  lbfgs_epochs: 0
  resample_every: 0
  w_pde: 1.0
  w_data: 1.0
  log_every: 1000
  eval_every: 2000
