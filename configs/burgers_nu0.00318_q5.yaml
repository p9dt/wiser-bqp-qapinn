# nu-sweep cell: nu=0.00318 (thicker shock -> narrower spectrum as nu grows),
# n_qubits=5. Tests whether the qubit count needed to resolve the shock tracks
# the spectral width, per NEXT_STEPS item 3 (the "cleanest single test").
run_name: burgers_nu0.00318_q5
seed: 1234

pde:
  name: burgers
  nu: 0.003183098861837907
  t_max: 1.0

model:
  type: qapinn
  hidden: 20
  depth: 4
  activation: tanh
  quantum:
    n_qubits: 5
    n_layers: 2
    encoding: reupload
    entanglement: ring
    measurement: expectation
    trainable_scaling: true

training:
  n_collocation: 8000
  n_supervised: 400
  adam_epochs: 8000
  adam_lr: 0.001
  lbfgs_epochs: 500
  resample_every: 0
  w_pde: 1.0
  w_data: 1.0
  log_every: 1000
  eval_every: 2000
