run_name: heat_qapinn_q4_matched
seed: 1234

pde:
  name: heat
  alpha: 0.05
  modes: [[1, 1.0], [4, 0.5]]
  t_max: 1.0

model:
  type: qapinn
  hidden: 20
  depth: 4
  activation: tanh
  quantum:
    n_qubits: 4
    n_layers: 2
    encoding: reupload      # angle | reupload
    entanglement: ring      # none | linear | ring | all_to_all
    measurement: expectation  # expectation | probs
    trainable_scaling: true

training:
  n_collocation: 2000
  n_supervised: 300
  adam_epochs: 6000
  adam_lr: 0.005
  lbfgs_epochs: 500
  resample_every: 0
  w_pde: 1.0
  w_data: 1.0
  log_every: 250
  eval_every: 500
